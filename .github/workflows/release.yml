# When stable moves (./release.sh), tag the version and write the notes, so a household can say which version it runs
# and a release can be pointed at or rolled back by name.
name: release
on:
  push:
    branches: [stable]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: One last secrets check before it goes to every household
        run: bash scripts/check-no-secrets.sh
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [[ -n "$prev" ]]; then
            notes=$(git log --no-decorate --format='- %s' "$prev..HEAD")
            range="since $prev"
          else
            notes=$(git log --no-decorate --format='- %s' -20)
            range="first tagged release"
          fi
          git tag "$tag"
          git push origin "$tag"
          printf 'Released to stable (%s).\n\nHouseholds get this on their next `update.sh` / `update.ps1`.\n\n%s\n' "$range" "$notes" > /tmp/notes.md
          gh release create "$tag" --title "$tag" --notes-file /tmp/notes.md
          echo "released $tag"
